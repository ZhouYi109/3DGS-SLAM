# Gaussian-LIC paper settings for R3LIVE sequences.
width: 640
height: 512
fx: 431.71205
fy: 431.70855
cx: 320.3404
cy: 259.1696

select_every_k_frame: 5
depth_completion: false
patch_size: 10
max_depth: 20
checkpoint_every_keyframes: 0

# Timestamped CLIP/SAM feature grids are optional. When absent, geometry and
# rendering behavior remain identical to the non-semantic baseline.
# Semantic memory is a sidecar by default and must not alter Gaussian optimization.
online_semantic_enabled: false
semantic_feature_topic: "/semantic_feature_grid"
semantic_sync_tolerance_sec: 0.02
semantic_wait_timeout_sec: 0.8
semantic_confidence_threshold: 0.05
semantic_compact_dim: 0  # Object-level memory: Gaussians store only int32 object IDs.
semantic_memory_similarity_threshold: 0.90
semantic_projection_seed: 20260726
semantic_storage_growth_rows: 32768
prune_every_keyframes: 0
prune_opacity_threshold: 0.0

# Disabled baseline; enable only with the exported 24D -> 14D TorchScript head.
semantic_gaussian_prior_enabled: false
semantic_gaussian_prior_model_path: ""
semantic_gaussian_prior_strategy: "full"
semantic_gaussian_prior_input_dim: 24
semantic_gaussian_prior_context_gain: 1.0
semantic_gaussian_prior_exact_spacing: true
semantic_gaussian_prior_lightweight_context: false
semantic_gaussian_prior_mean_offset_limit: 1.0
semantic_gaussian_prior_log_scale_limit: 1.0
semantic_gaussian_prior_color_residual_limit: 0.25
semantic_gaussian_prior_opacity_logit_limit: 2.0
residual_optimization_iters: 100

sh_degree: 3
white_background: false
random_background: false
convert_SHs_python: false
compute_cov3D_python: false
lambda_erank: 0
scaling_scale: 2

position_lr: 0.00016
feature_lr: 0.0050
opacity_lr: 0.05
scaling_lr: 0.015
rotation_lr: 0.001
lambda_dssim: 0.2

# The original Gaussian-LIC loss is RGB L1 + D-SSIM; depth supervision and
# iteration decay belong to the later implementation path.
optimize_depth: false
lambda_depth: 0.0
iteration_decay: false

# Values stated in the Gaussian-LIC paper, Sec. IV-A.
apply_exposure: true
exposure_lr: 0.001
skybox_points_num: 100000
skybox_radius: 10000
