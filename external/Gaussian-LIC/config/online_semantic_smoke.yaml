# Small deterministic configuration for validating online semantic alignment.
width: 64
height: 48
fx: 50.0
fy: 50.0
cx: 32.0
cy: 24.0

select_every_k_frame: 2
depth_completion: false
patch_size: 8
max_depth: 20
checkpoint_every_keyframes: 0

online_semantic_enabled: true
semantic_feature_topic: "/semantic_feature_grid"
semantic_sync_tolerance_sec: 0.001
semantic_wait_timeout_sec: 0.0
semantic_confidence_threshold: 0.05
semantic_compact_dim: 0
semantic_memory_similarity_threshold: 0.90
semantic_projection_seed: 20260726
semantic_storage_growth_rows: 128

# The second keyframe prunes the lower-opacity initialization batch. This is
# enabled only in the smoke configuration to exercise semantic index pruning.
prune_every_keyframes: 2
prune_opacity_threshold: 0.12

sh_degree: 1
white_background: false
random_background: false
convert_SHs_python: false
compute_cov3D_python: false
lambda_erank: 0
scaling_scale: 2

position_lr: 0.00016
feature_lr: 0.005
opacity_lr: 0.05
scaling_lr: 0.015
rotation_lr: 0.001
lambda_dssim: 0.2
optimize_depth: false
lambda_depth: 0.0
iteration_decay: false
dynamic_appearance_weight: false
dynamic_geometry_capacity: false
random_seed: 20260726

apply_exposure: false
exposure_lr: 0.001
skybox_points_num: 0
skybox_radius: 100
